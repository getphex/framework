name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        elephc:
          - tag: v0.27.6
            application: false
          - tag: v0.27.7
            application: true
    env:
      ELEPHC_VERSION: ${{ matrix.elephc.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libbz2-dev
      - name: Install ElephC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phex_toolchain_dir="$(mktemp -d "$RUNNER_TEMP/phex-elephc.XXXXXX")"
          echo "PHEX_ELEPHC_DIR=$phex_toolchain_dir" >> "$GITHUB_ENV"
          phex_archive="elephc-${ELEPHC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$ELEPHC_VERSION" --repo illegalstudio/elephc \
            --pattern "$phex_archive" --pattern "$phex_archive.sha256" \
            --dir "$phex_toolchain_dir"
          cd "$phex_toolchain_dir"
          sha256sum --check "$phex_archive.sha256"
          tar -xzf "$phex_archive"
          echo "$phex_toolchain_dir" >> "$GITHUB_PATH"
      - name: Verify the precompiled SDK
        env:
          REQUIRE_APPLICATION: ${{ matrix.elephc.application }}
        run: |
          elephc --version
          python3 - <<'PYTHON'
          import os, re, subprocess
          from pathlib import Path
          sdk = Path(os.environ['PHEX_ELEPHC_DIR'])
          capabilities = subprocess.check_output([str(sdk/'elephc'), '--print-capabilities'], text=True)
          archives = set(re.findall(r'libelephc_[A-Za-z0-9_]+\.a', capabilities))
          assert archives and all((sdk/name).is_file() for name in archives), 'Incomplete precompiled ElephC SDK'
          if os.environ['REQUIRE_APPLICATION'] == 'true':
              help_text = subprocess.check_output([str(sdk/'elephc'), '--help'], text=True)
              assert '--web-lifecycle' in help_text, 'Release SDK must support application lifecycle'
          print('Verified precompiled runtime archives:', len(archives))
          PYTHON
      - run: composer install --no-interaction --prefer-dist
      - run: composer tools:install
      - run: composer check
      - name: Verify persistent native applications
        if: matrix.elephc.application
        run: composer test:persistent
      - name: Remove toolchain artifacts
        if: always() && env.PHEX_ELEPHC_DIR != ''
        run: rm -rf -- "$PHEX_ELEPHC_DIR"
