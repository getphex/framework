name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    env:
      ELEPHC_VERSION: v0.27.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install ElephC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phex_toolchain_dir="$(mktemp -d "$RUNNER_TEMP/phex-elephc.XXXXXX")"
          echo "PHEX_ELEPHC_DIR=$phex_toolchain_dir" >> "$GITHUB_ENV"
          phex_archive="elephc-$ELEPHC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$ELEPHC_VERSION" --repo illegalstudio/elephc \
            --pattern "$phex_archive" --pattern "$phex_archive.sha256" \
            --dir "$phex_toolchain_dir"
          cd "$phex_toolchain_dir"
          sha256sum --check "$phex_archive.sha256"
          tar -xzf "$phex_archive"
          echo "$phex_toolchain_dir" >> "$GITHUB_PATH"
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - name: Remove toolchain artifacts
        if: always() && env.PHEX_ELEPHC_DIR != ''
        run: rm -rf -- "$PHEX_ELEPHC_DIR"
